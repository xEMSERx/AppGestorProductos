<div class="container">
    <div class="header-controls"> <!-- Controles superiores: Buscador y Botón Agregar -->
        <mat-form-field appearance="outline" class="search-input" subscriptSizing="dynamic">
            <mat-label>Buscar producto...</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Computadora">
            <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <button mat-raised-button color="primary" routerLink="/products/new">
            <mat-icon>add</mat-icon> Agregar Producto
        </button>
    </div>

    <table mat-table [dataSource]="products" class="mat-elevation-z8"> <!-- Tabla de Angular Material -->

        <ng-container matColumnDef="id"> <!-- Columna de ID -->
            <th mat-header-cell *matHeaderCellDef> ID </th>
            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <ng-container matColumnDef="name"> <!-- Columna de nombre -->
            <th mat-header-cell *matHeaderCellDef> Nombre </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="price"> <!-- Columna de precio -->
            <th mat-header-cell *matHeaderCellDef> Precio ($) </th>
            <td mat-cell *matCellDef="let element"> {{element.price | customCurrency}} </td>
        </ng-container>

        <ng-container matColumnDef="priceUsd"> <!-- Columna de precio en USD -->
            <th mat-header-cell *matHeaderCellDef> Precio (USD) </th>
            <td mat-cell *matCellDef="let element">
                <span *ngIf="exchangeRate > 0">{{(element.price / exchangeRate) | customCurrency:'USD'}}</span>
                <span *ngIf="exchangeRate === 0">Cargando...</span>
            </td>
        </ng-container>

        <ng-container matColumnDef="stock"> <!-- Columna de stock -->
            <th mat-header-cell *matHeaderCellDef> Stock </th>
            <td mat-cell *matCellDef="let element"> {{element.stock}} </td>
        </ng-container>

        <ng-container matColumnDef="category"> <!-- Columna de categoría -->
            <th mat-header-cell *matHeaderCellDef> Categoría </th>
            <td mat-cell *matCellDef="let element"> {{element.category}} </td>
        </ng-container>

        <ng-container matColumnDef="actions"> <!-- Columna de acciones (Botones) -->
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button color="primary" [routerLink]="['/products/edit', element.id]">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteProduct(element.id)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
