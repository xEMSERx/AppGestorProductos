<div class="form-container">
    <form [formGroup]="productForm" (ngSubmit)="saveProduct()">
        <!-- El [formGroup] conecta este formulario HTML con nuestra lógica en TypeScript -->
        <h2>{{ isEdit ? 'Editar' : 'Agregar' }} Producto</h2>

        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Nombre del Producto</mat-label>
            <input matInput formControlName="name" placeholder="Ej. Teclado Mecánico">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Precio ($)</mat-label>
            <input matInput type="number" formControlName="price" placeholder="Ej. 15000">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Stock</mat-label>
            <input matInput type="number" formControlName="stock" placeholder="Ej. 10">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Categoría</mat-label>
            <input matInput formControlName="category" placeholder="Ej. Periféricos">
        </mat-form-field>

        <div class="button-group">
            <!-- El botón se deshabilita si el formulario es inválido -->
            <button mat-raised-button color="primary" type="submit" [disabled]="productForm.invalid">
                Guardar
            </button>
            <button mat-raised-button color="warn" type="button" routerLink="/products">
                Cancelar
            </button>
        </div>
    </form>
</div>
