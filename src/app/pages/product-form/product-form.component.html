<div class="form-container">
    <form [formGroup]="productForm" (ngSubmit)="saveProduct()">
        <h2>{{ isEdit ? 'Editar' : 'Agregar' }} Producto</h2>

        <!-- 1. Campo Nombre -->
        <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
            <mat-label>Nombre del Producto</mat-label>
            <input matInput formControlName="name" placeholder="Ej. Teclado Mecánico">
            <mat-error *ngIf="productForm.get('name')?.hasError('required')">
                El nombre es obligatorio
            </mat-error>
        </mat-form-field>

        <!-- 2. Campo Precio -->
        <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
            <mat-label>Precio ($)</mat-label>
            <input matInput type="number" formControlName="price" placeholder="Ej. 15000">
            <mat-error *ngIf="productForm.get('price')?.hasError('required')">
                El precio es obligatorio
            </mat-error>
            <mat-error *ngIf="productForm.get('price')?.hasError('min')">
                El precio debe ser mayor a 0
            </mat-error>
        </mat-form-field>

        <!-- 3. Campo Stock -->
        <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
            <mat-label>Stock</mat-label>
            <input matInput type="number" formControlName="stock" placeholder="Ej. 10">
            <mat-error *ngIf="productForm.get('stock')?.hasError('required')">
                El stock es obligatorio
            </mat-error>
            <mat-error *ngIf="productForm.get('stock')?.hasError('min')">
                El stock no puede ser negativo
            </mat-error>
        </mat-form-field>

        <!-- 4. Campo Categoría -->
        <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
            <mat-label>Categoría</mat-label>
            <input matInput formControlName="category" placeholder="Ej. Periféricos">
            <mat-error *ngIf="productForm.get('category')?.hasError('required')">
                La categoría es obligatoria
            </mat-error>
        </mat-form-field>

        <!-- Botones de Acción -->
        <div class="button-group">
            <button mat-raised-button color="primary" type="submit" [disabled]="productForm.invalid || isSaving">
                {{ isSaving ? 'Guardando...' : 'Guardar' }}
            </button>
            <button mat-raised-button color="warn" type="button" routerLink="/products" [disabled]="isSaving">
                Cancelar
            </button>
        </div>
    </form>
</div>
